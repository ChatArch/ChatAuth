[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatAuth"
dynamic = ["version"]
description = "Self-hosted OAuth-style refresh-token auth service for ChatArch."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "RexWzh", email = "rex@wzhecnu.cn"}]
keywords = ["chatauth"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.setuptools.dynamic]
version = {attr = "chatauth.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
